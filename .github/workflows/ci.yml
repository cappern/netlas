name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build 3D bundle
        run: npm run build:3d

      - name: Type-check
        run: npm run typecheck

      - name: Svelte check
        run: npm run check

      - name: Test
        run: npm test

      - name: Validate example models
        run: npm run validate:examples
