# netlas example: dependency visibility.
#
# The physical layers say what is cabled to what. This model adds the other
# question an on-call engineer actually asks: if this box goes down, what
# stops working? The dependencies: block records that, and the DEP layer
# draws it — consumers above, providers below, arrows pointing at what is
# needed.
#
#   node bin/netlas.mjs render examples/ise-dependencies.netlas.yaml

meta:
  title: ISE Policy Service
  subtitle: Network access control and its dependencies
  owner: Network Services
  version: "2.1"
  updated: "2026-09-20"
  theme: signal

sites:
  - { id: hq, label: HQ Data Centre, kind: dc }

zones:
  - { id: untrust, label: Untrust, site: hq, kind: untrust }
  - { id: trust, label: Trust, site: hq, kind: trust }
  - { id: mgmt, label: Management, site: hq, kind: mgmt }

vlans:
  - { id: 10, name: USERS, subnet: 10.20.10.0/24, gateway: 10.20.10.1, zone: trust, purpose: Wired and wireless clients }
  - { id: 20, name: SERVERS, subnet: 10.20.20.0/24, gateway: 10.20.20.1, zone: trust, purpose: Policy and infrastructure servers }
  - { id: 99, name: MGMT, subnet: 10.20.99.0/24, gateway: 10.20.99.1, zone: mgmt, purpose: Device management }

devices:
  - id: sw-core-1
    label: SW-CORE-1
    role: core
    vendor: cisco
    model: C9500-24Y4C
    zone: trust
    interfaces:
      - { name: Vlan10, mode: svi, ip: 10.20.10.1/24 }
      - { name: Vlan20, mode: svi, ip: 10.20.20.1/24 }
      - { name: Vlan99, mode: svi, ip: 10.20.99.1/24 }
      - { name: Te1/0/1, mode: trunk, vlans: [10, 20, 99], native_vlan: 99, speed: 10G, description: Access switch uplink }
      - { name: Te1/0/2, mode: trunk, vlans: [10, 99], speed: 10G, description: Wireless controller }
      - { name: Te1/0/3, mode: trunk, vlans: [99], speed: 10G, description: Perimeter firewall }
      - { name: Gi1/0/1, mode: access, vlan: 20, speed: 1G }
      - { name: Gi1/0/2, mode: access, vlan: 20, speed: 1G }
      - { name: Gi1/0/3, mode: access, vlan: 20, speed: 1G }
      - { name: Gi1/0/4, mode: access, vlan: 20, speed: 1G }
      - { name: Gi1/0/5, mode: access, vlan: 20, speed: 1G }
      - { name: Gi1/0/6, mode: access, vlan: 20, speed: 1G }
      - { name: Gi1/0/7, mode: access, vlan: 20, speed: 1G }

  - id: sw-acc-1
    label: SW-ACC-1
    role: access
    vendor: cisco
    model: C9300-48P
    zone: trust
    interfaces:
      - { name: Te1/1/1, mode: trunk, vlans: [10, 20, 99], native_vlan: 99, speed: 10G }
      - { name: Gi1/0/1, mode: access, vlan: 10, speed: 1G, description: 802.1X access port }
      - { name: Vlan99, mode: svi, ip: 10.20.99.11/24 }

  - id: wlc-1
    label: WLC-1
    role: wireless
    vendor: cisco
    model: C9800-40
    zone: trust
    interfaces:
      - { name: Te0/0/1, mode: trunk, vlans: [10, 99], speed: 10G }
      - { name: Vlan99, mode: svi, ip: 10.20.99.12/24 }

  - id: fw-edge-1
    label: FW-EDGE-1
    role: firewall
    vendor: cisco
    model: FPR-3110
    zone: untrust
    interfaces:
      - { name: Ethernet1/1, mode: trunk, vlans: [99], speed: 10G }
      - { name: Management1/1, mode: mgmt, ip: 10.20.99.13/24 }

  - id: ise-psn-1
    label: ISE-PSN-1
    role: server
    vendor: cisco
    model: SNS-3715
    os: ISE 3.3
    zone: trust
    notes: Policy Service Node. Terminates RADIUS and TACACS+ for every network access device.
    interfaces:
      - { name: GigabitEthernet0, mode: access, vlan: 20, ip: 10.20.20.21/24, speed: 1G }
    services:
      - { name: radius, port: 1812, proto: udp, critical: true, notes: 802.1X and MAB authentication }
      - { name: tacacs, port: 49, proto: tcp, notes: Device administration }

  - id: ise-pan-1
    label: ISE-PAN-1
    role: server
    vendor: cisco
    model: SNS-3715
    os: ISE 3.3
    zone: trust
    notes: Primary Admin Node. Owns policy; the PSNs are replicas of what is configured here.
    interfaces:
      - { name: GigabitEthernet0, mode: access, vlan: 20, ip: 10.20.20.22/24, speed: 1G }
    services:
      - { name: admin, port: 443, proto: https, critical: true, notes: Policy administration and replication }
      - { name: ers, port: 9060, proto: https, notes: External RESTful Services API }
      - { name: pxgrid, port: 8910, proto: tcp, notes: "pxGrid controller persona; clients register here, not with a PSN" }

  - id: dnac-1
    label: DNAC-1
    role: appliance
    vendor: cisco
    model: DN2-HW-APL
    zone: trust
    interfaces:
      - { name: enterprise, mode: access, vlan: 20, ip: 10.20.20.23/24, speed: 10G }
    services:
      - { name: assurance, port: 443, proto: https }

  - id: fmc-1
    label: FMC-1
    role: appliance
    vendor: cisco
    model: FMCv300
    zone: mgmt
    interfaces:
      - { name: eth0, mode: access, vlan: 20, ip: 10.20.20.24/24, speed: 1G }
    services:
      - { name: fmc api, port: 443, proto: https }

  - id: srv-ad-1
    label: SRV-AD-1
    role: server
    vendor: microsoft
    os: Windows Server 2022
    zone: trust
    interfaces:
      - { name: eth0, mode: access, vlan: 20, ip: 10.20.20.31/24, speed: 1G }
    services:
      - { name: ldaps, port: 636, proto: tcp, critical: true, notes: Identity lookup for policy conditions }
      - { name: kerberos, port: 88, proto: tcp }
      - { name: dns, port: 53, proto: udp, critical: true }

  - id: srv-ntp-1
    label: SRV-NTP-1
    role: server
    vendor: linux
    os: Chrony
    zone: trust
    interfaces:
      - { name: eth0, mode: access, vlan: 20, ip: 10.20.20.32/24, speed: 1G }
    services:
      - { name: ntp, port: 123, proto: udp, critical: true }

  - id: srv-siem-1
    label: SRV-SIEM-1
    role: server
    vendor: linux
    os: Splunk
    zone: trust
    interfaces:
      - { name: eth0, mode: access, vlan: 20, ip: 10.20.20.33/24, speed: 1G }
    services:
      - { name: syslog, port: 514, proto: udp }

links:
  - { a: "sw-core-1:Te1/0/1", b: "sw-acc-1:Te1/1/1", media: fiber, speed: 10G }
  - { a: "sw-core-1:Te1/0/2", b: "wlc-1:Te0/0/1", media: fiber, speed: 10G }
  - { a: "sw-core-1:Te1/0/3", b: "fw-edge-1:Ethernet1/1", media: fiber, speed: 10G }
  - { a: "sw-core-1:Gi1/0/1", b: "ise-psn-1:GigabitEthernet0", media: copper, speed: 1G }
  - { a: "sw-core-1:Gi1/0/2", b: "ise-pan-1:GigabitEthernet0", media: copper, speed: 1G }
  - { a: "sw-core-1:Gi1/0/3", b: "dnac-1:enterprise", media: copper, speed: 1G }
  - { a: "sw-core-1:Gi1/0/4", b: "fmc-1:eth0", media: copper, speed: 1G }
  - { a: "sw-core-1:Gi1/0/5", b: "srv-ad-1:eth0", media: copper, speed: 1G }
  - { a: "sw-core-1:Gi1/0/6", b: "srv-ntp-1:eth0", media: copper, speed: 1G }
  - { a: "sw-core-1:Gi1/0/7", b: "srv-siem-1:eth0", media: copper, speed: 1G }

# Systems this drawing depends on but does not document. Kept out of devices:
# so they never appear in the physical layers.
externals:
  - { id: entra, label: Microsoft Entra ID, kind: identity, owner: Identity Services, url: "https://entra.microsoft.com" }
  - { id: pki-root, label: Corporate Issuing CA, kind: pki, owner: Security Operations }
  - { id: cisco-sl, label: Cisco Smart Licensing, kind: saas, owner: Cisco }

# strength is required: hard means the consumer stops, soft means it degrades.
# Guessing this on the author's behalf would make every blast radius wrong.
dependencies:
  # Network access devices cannot authenticate anyone without the PSN.
  - { from: sw-acc-1, to: "ise-psn-1:radius", kind: auth, strength: hard, description: 802.1X and MAB on every access port }
  - { from: wlc-1, to: "ise-psn-1:radius", kind: auth, strength: hard, description: WPA2-Enterprise for corporate SSIDs }

  # Device administration falls back to local accounts, so this degrades.
  - { from: fw-edge-1, to: "ise-psn-1:tacacs", kind: auth, strength: soft, description: Admin login; local fallback account exists }
  - { from: sw-core-1, to: "ise-psn-1:tacacs", kind: auth, strength: soft, description: Admin login; local fallback account exists }

  # Context sharing.
  - { from: dnac-1, to: "ise-pan-1:pxgrid", kind: api, strength: hard, description: SGT and group exchange for SD-Access policy automation }
  - { from: fmc-1, to: "ise-pan-1:pxgrid", kind: api, strength: soft, description: Identity-based policy; existing rules keep enforcing }

  # Firepower keeps forwarding without its manager; what stops is policy
  # deployment and unified event logging.
  - { from: fw-edge-1, to: "fmc-1:fmc api", kind: management, strength: soft, description: Policy deployment and event logging }

  # What the PSN itself needs. Two services to the same provider with the same
  # kind and strength merge into one edge labelled "ldaps +1".
  - { from: ise-psn-1, to: "ise-pan-1:admin", kind: management, strength: soft, description: Policy edits and profiling writes stop; replicated policy keeps being enforced }
  - { from: ise-psn-1, to: "srv-ad-1:ldaps", kind: auth, strength: hard, description: Identity and group lookup for policy conditions }
  - { from: ise-psn-1, to: "srv-ad-1:kerberos", kind: auth, strength: hard, description: Machine authentication }
  - { from: ise-psn-1, to: "srv-ad-1:dns", kind: dns, strength: hard }
  - { from: ise-psn-1, to: "srv-ntp-1:ntp", kind: ntp, strength: hard, description: Certificate validity and log correlation both depend on clock }
  - { from: ise-psn-1, to: pki-root, kind: pki, strength: hard, description: EAP-TLS chain validation and CRL retrieval }
  - { from: ise-psn-1, to: "srv-siem-1:syslog", kind: logging, strength: soft, description: Authentication audit trail }

  - { from: ise-pan-1, to: entra, kind: auth, strength: soft, description: MFA for administrator sign-in }
  - { from: ise-pan-1, to: cisco-sl, kind: license, strength: soft, description: Entitlement reporting; 90-day grace period }
  - { from: dnac-1, to: "srv-ad-1:dns", kind: dns, strength: hard }

layout: {}
