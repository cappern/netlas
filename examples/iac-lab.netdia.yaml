# netdia example: an infrastructure-as-code lab.
# One model, three layers. L1 is the cabling, L2 is the VLANs, L3 is the routing.

meta:
  title: IaC Lab
  subtitle: Terraform and Ansible controlled test environment
  owner: Platform Engineering
  version: "1.4"
  updated: "2026-09-19"
  theme: signal

sites:
  - { id: lab, label: Lab Rack A, kind: lab }

zones:
  - { id: untrust, label: Untrust, site: lab, kind: untrust }
  - { id: dmz, label: DMZ, site: lab, kind: dmz }
  - { id: trust, label: Trust, site: lab, kind: trust }
  - { id: mgmt, label: Management, site: lab, kind: mgmt }

vlans:
  - { id: 10, name: USERS, subnet: 10.10.10.0/24, gateway: 10.10.10.1, zone: trust, purpose: Workstations and jump hosts }
  - { id: 20, name: SERVERS, subnet: 10.10.20.0/24, gateway: 10.10.20.1, zone: trust, purpose: Windows and Linux server estate }
  - { id: 30, name: DMZ, subnet: 10.10.30.0/24, gateway: 10.10.30.1, zone: dmz, purpose: Internet facing services }
  - { id: 40, name: STORAGE, subnet: 10.10.40.0/24, gateway: 10.10.40.1, zone: trust, purpose: NFS and iSCSI }
  - { id: 99, name: MGMT, subnet: 10.10.99.0/24, gateway: 10.10.99.1, zone: mgmt, purpose: Out-of-band device management }

subnets:
  - { cidr: 198.51.100.0/30, name: ISP transit, zone: untrust }
  - { cidr: 172.16.0.0/30, name: Firewall to core transit, zone: trust }

devices:
  - id: internet
    label: Internet
    role: internet
    vendor: generic
    zone: untrust

  - id: fw-edge-1
    label: FW-EDGE-1
    role: firewall
    vendor: paloalto
    model: PA-440
    os: PAN-OS 11.1
    site: lab
    zone: untrust
    mgmt_ip: 10.10.99.10
    interfaces:
      - { name: ethernet1/1, mode: wan, speed: 1G, ip: 198.51.100.2/30, zone: untrust, description: ISP uplink }
      - { name: ethernet1/2, mode: routed, speed: 1G, ip: 172.16.0.1/30, zone: trust, description: Core transit }
      - { name: ethernet1/3, mode: routed, speed: 1G, ip: 10.10.30.1/24, zone: dmz, description: DMZ gateway }
      - { name: management, mode: mgmt, speed: 1G, ip: 10.10.99.10/24, zone: mgmt }
    services:
      - { name: PAN-OS web UI, port: 443, proto: https }

  - id: sw-core-1
    label: SW-CORE-1
    role: core
    vendor: cisco
    model: C9300-24T
    os: IOS-XE 17.12
    site: lab
    zone: trust
    mgmt_ip: 10.10.99.11
    interfaces:
      - { name: Gi1/0/1, mode: routed, speed: 1G, ip: 172.16.0.2/30, description: Uplink to FW-EDGE-1 }
      - { name: Gi1/0/11, mode: trunk, speed: 1G, vlans: [10, 20, 99], native_vlan: 99, description: To SW-ACC-1 }
      - { name: Gi1/0/12, mode: trunk, speed: 1G, vlans: [20, 40, 99], native_vlan: 99, description: To SW-ACC-2 }
      - { name: Gi1/0/24, mode: access, speed: 1G, vlan: 30, description: DMZ handoff to firewall }
      - { name: Vlan10, mode: svi, ip: 10.10.10.1/24, vrf: default }
      - { name: Vlan20, mode: svi, ip: 10.10.20.1/24, vrf: default }
      - { name: Vlan40, mode: svi, ip: 10.10.40.1/24, vrf: default }
      - { name: Vlan99, mode: svi, ip: 10.10.99.1/24, vrf: default }

  - id: sw-acc-1
    label: SW-ACC-1
    role: access
    vendor: cisco
    model: C9200-48P
    os: IOS-XE 17.9
    site: lab
    zone: trust
    mgmt_ip: 10.10.99.21
    interfaces:
      - { name: Gi1/0/48, mode: trunk, speed: 1G, vlans: [10, 20, 99], native_vlan: 99, description: Uplink to core }
      - { name: Gi1/0/1, mode: access, speed: 1G, vlan: 20, description: ESXI-1 }
      - { name: Gi1/0/2, mode: access, speed: 1G, vlan: 20, description: SRV-GIT-1 }
      - { name: Gi1/0/3, mode: access, speed: 1G, vlan: 10, description: WKS-ADMIN-1 }

  - id: sw-acc-2
    label: SW-ACC-2
    role: access
    vendor: cisco
    model: C9200-24P
    os: IOS-XE 17.9
    site: lab
    zone: trust
    mgmt_ip: 10.10.99.22
    interfaces:
      - { name: Gi1/0/24, mode: trunk, speed: 1G, vlans: [20, 40, 99], native_vlan: 99, description: Uplink to core }
      - { name: Gi1/0/1, mode: access, speed: 1G, vlan: 20, description: SRV-DC-1 }
      - { name: Gi1/0/2, mode: access, speed: 1G, vlan: 40, description: NAS-1 }
      - { name: Gi1/0/3, mode: access, speed: 1G, vlan: 30, description: SRV-WEB-1 }

  - id: esxi-1
    label: ESXI-1
    role: hypervisor
    vendor: vmware
    model: Dell R650
    os: ESXi 8.0U2
    site: lab
    zone: trust
    mgmt_ip: 10.10.20.10
    interfaces:
      - { name: vmnic0, mode: access, speed: 10G, ip: 10.10.20.10/24, vlan: 20 }

  - id: srv-dc-1
    label: SRV-DC-1
    role: server
    vendor: microsoft
    model: Virtual machine
    os: Windows Server 2022
    site: lab
    zone: trust
    interfaces:
      - { name: eth0, mode: access, speed: 1G, ip: 10.10.20.20/24, vlan: 20 }
    services:
      - { name: Active Directory, port: 389, proto: tcp }
      - { name: DNS, port: 53, proto: udp }

  - id: srv-git-1
    label: SRV-GIT-1
    role: server
    vendor: git
    model: Virtual machine
    os: Ubuntu 24.04
    site: lab
    zone: trust
    interfaces:
      - { name: eth0, mode: access, speed: 1G, ip: 10.10.20.30/24, vlan: 20 }
    services:
      - { name: Gitea, port: 3000, proto: https }
      - { name: Terraform state, port: 8080, proto: https }

  - id: srv-web-1
    label: SRV-WEB-1
    role: server
    vendor: linux
    model: Virtual machine
    os: Debian 12
    site: lab
    zone: dmz
    interfaces:
      - { name: eth0, mode: access, speed: 1G, ip: 10.10.30.20/24, vlan: 30 }
    services:
      - { name: nginx, port: 443, proto: https }

  - id: nas-1
    label: NAS-1
    role: storage
    vendor: linux
    model: TrueNAS
    site: lab
    zone: trust
    interfaces:
      - { name: bond0, mode: access, speed: 10G, ip: 10.10.40.10/24, vlan: 40 }
    services:
      - { name: NFS, port: 2049, proto: tcp }

  - id: wks-admin-1
    label: WKS-ADMIN-1
    role: client
    vendor: linux
    model: Workstation
    os: Fedora 41
    site: lab
    zone: trust
    interfaces:
      - { name: eth0, mode: access, speed: 1G, ip: 10.10.10.50/24, vlan: 10 }

links:
  - { a: internet, b: "fw-edge-1:ethernet1/1", media: wan, speed: 1G, label: ISP }
  - { a: "fw-edge-1:ethernet1/2", b: "sw-core-1:Gi1/0/1", media: copper, speed: 1G }
  - { a: "fw-edge-1:ethernet1/3", b: "sw-core-1:Gi1/0/24", media: copper, speed: 1G }
  - { a: "sw-core-1:Gi1/0/11", b: "sw-acc-1:Gi1/0/48", media: fiber, speed: 1G }
  - { a: "sw-core-1:Gi1/0/12", b: "sw-acc-2:Gi1/0/24", media: fiber, speed: 1G }
  - { a: "sw-acc-1:Gi1/0/1", b: "esxi-1:vmnic0", media: copper, speed: 10G }
  - { a: "sw-acc-1:Gi1/0/2", b: "srv-git-1:eth0", media: copper, speed: 1G }
  - { a: "sw-acc-1:Gi1/0/3", b: "wks-admin-1:eth0", media: copper, speed: 1G }
  - { a: "sw-acc-2:Gi1/0/1", b: "srv-dc-1:eth0", media: copper, speed: 1G }
  - { a: "sw-acc-2:Gi1/0/2", b: "nas-1:bond0", media: copper, speed: 10G }
  - { a: "sw-acc-2:Gi1/0/3", b: "srv-web-1:eth0", media: copper, speed: 1G }

routing:
  - { from: fw-edge-1, to: internet, kind: default, detail: "0.0.0.0/0 via 198.51.100.1" }
  - { from: sw-core-1, to: fw-edge-1, kind: default, detail: "0.0.0.0/0 via 172.16.0.1" }
  - { from: fw-edge-1, to: sw-core-1, kind: static, detail: "10.10.0.0/16 via 172.16.0.2" }

layout: {}
